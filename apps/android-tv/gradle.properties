org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# AGP 9.0 defaults to its new built-in Kotlin support (android.builtInKotlin
# and android.newDsl both default to true), which is incompatible with the
# separate org.jetbrains.kotlin.android plugin applied in app/build.gradle.kts.
# That new DSL is very new (post-dates any well-established reference
# material) so we opt out here and use the long-established, well-documented
# Kotlin Gradle plugin approach instead. Revisit this if/when migrating to
# the new built-in-Kotlin DSL.
# https://developer.android.com/build/releases/agp-9-0-0-release-notes
android.builtInKotlin=false
android.newDsl=false

# If Gradle can't find a JDK it likes (or picks one AGP doesn't support),
# point it at Android Studio's own bundled JDK rather than fighting your
# system Java version — this is machine-specific so it's not hardcoded
# here; add a line like the one below to *this file locally* (don't commit
# it) or to ~/.gradle/gradle.properties instead:
#   org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home   (macOS)
